x-ros2-common: &ros2-common
  build:
    context: .
    dockerfile: Dockerfile
  image: arc380_ros2:latest
  network_mode: host

  volumes:
    - ../workshops:/workshops
    - ../scripts:/scripts
    - ../realsense_shared:/realsense_shared

  environment:
    - DISPLAY=:1
    - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
    - CYCLONEDDS_URI=/cyclonedds.xml
    - LIBGL_ALWAYS_SOFTWARE=1
    - GALLIUM_DRIVER=llvmpipe
    - QT_X11_NO_MITSHM=1
    - OPENAI_API_KEY=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
     
  ipc: host
  stdin_open: true
  tty: true
  restart: unless-stopped

services:
  ros2_sim:
    <<: *ros2-common
    container_name: arc380_ros2
    # no command override, so entrypoint.sh runs simulation by default

  ros2_real:
    <<: *ros2-common
    container_name: arc380_ros2_real
    command: ros2 launch abb_egm_controller egm_controller.launch.py
